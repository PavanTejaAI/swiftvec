[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "swiftvec"
version = "0.3.0"
description = "Fully on-device vector search engine with built-in embeddings - no cloud, no server, no account"
authors = [{ name = "Pavan Teja" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
keywords = ["vector-search", "semantic-search", "embeddings", "on-device", "hnsw", "ann", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/PavanTejaAI/swiftvec"
Repository = "https://github.com/PavanTejaAI/swiftvec"
Documentation = "https://github.com/PavanTejaAI/swiftvec/tree/main/docs"
Issues = "https://github.com/PavanTejaAI/swiftvec/issues"

[tool.maturin]
python-source = "python"
module-name = "swiftvec._native"
features = ["pyo3/extension-module"]
include = [{ path = "python/swiftvec/libs/*", format = ["wheel"] }]
