[package]
name = "swiftvec-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "swiftvec"
path = "src/main.rs"

[dependencies]
swiftvec-core = { path = "../core" }
swiftvec-embed = { path = "../embed" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
